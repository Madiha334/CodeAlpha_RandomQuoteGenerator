
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator - CodeAlpha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="quote-box">
        <h2>✨ Random Quote Generator</h2>
        <div class="quote-text">
            <p id="quote">"Click the button below to generate an inspiring quote."</p>
            <small id="author">- CodeAlpha Intern</small>
        </div>
        <button id="btn">New Quote</button>
    </div>

    <script>
        // Client-side quotes array taake button instant aur flawlessly kaam kare
        const quotes = [
            { quote: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
            { quote: "Success is not final; failure is not fatal: It is the courage to continue that counts.", author: "Winston Churchill" },
            { quote: "The way to get started is to quit talking and begin doing.", author: "Walt Disney" },
            { quote: "Innovation distinguishes between a leader and a follower.", author: "Steve Jobs" },
            { quote: "Your time is limited, so don't waste it living someone else's life.", author: "Steve Jobs" },
            { quote: "Code is like humor. When you have to explain it, it’s bad.", author: "Cory House" },
            { quote: "Dream big and dare to fail.", author: "Norman Vaughan" }
        ];

        const btn = document.getElementById("btn");
        const quoteElement = document.getElementById("quote");
        const authorElement = document.getElementById("author");

        btn.addEventListener("click", function() {
            let randomIndex = Math.floor(Math.random() * quotes.length);
            quoteElement.innerText = `"${quotes[randomIndex].quote}"`;
            authorElement.innerText = `- ${quotes[randomIndex].author}`;
        });
    </script>
</body>
</html>
